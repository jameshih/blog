---
layout: default
---

<article class="article post">
  <header class="article-header">
    <p class="article-kicker">Project note</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  </header>
  <div class="article-body">{{ content }}</div>
</article>
<nav class="post-navigation" aria-label="More posts">
  {% if page.next.url %}<a href="{{ page.next.url | relative_url }}" rel="next"><span>Newer</span>{{ page.next.title }}</a>{% endif %}
  {% if page.previous.url %}<a href="{{ page.previous.url | relative_url }}" rel="prev"><span>Older</span>{{ page.previous.title }}</a>{% endif %}
</nav>
