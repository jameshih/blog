# Site Info
title: "James Shih"
repository: jameshih/blog
tagline: "Blog"
description: "Products, experiments, and notes by James Shih."
author:
  name: "James Shih"
  twitter: shih_app
  url: https://shih.app
logo: https://avatars.githubusercontent.com/u/9959168?v=4
locale: en_US
twitter:
  username: shih_app
  card: summary_large_image
social:
  name: "James Shih"
  links:
    - https://github.com/jameshih
    - https://x.com/shih_app

# Site Settings
url: https://shih.app # main url
baseurl: /blog
permalink: /:title # Post permalink
timezone: Asia/Taipei # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Site Build
highlighter: rouge
markdown: kramdown
kramdown:
  input: GFM
sass:
  style: :compressed

# Other Params
include: ["robots.txt"]
exclude:
  - LICENSE
  - README.md
  - CNAME
  - vendor
  - Gemfile
  - Gemfile.lock
  - script
  - node_modules
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      image: https://shih.app/social-card.png
  - scope:
      type: "posts"
    values:
      layout: "post"

# Google analytics
google_analytics: G-MKEB791QY8
