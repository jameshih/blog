---
layout: default
title: Blog
description: Products, experiments, and notes by James Shih.
image: https://shih.app/social-card.png
---

<section class="post-index" aria-labelledby="post-index-title">
  <header class="index-header">
    <p class="article-kicker">Selected work and experiments</p>
    <h1 id="post-index-title">Notes from James</h1>
  </header>
  <ol class="post-list">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    </li>
    {% endfor %}
  </ol>
</section>
